<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TalentNext — employer development report</title>

<!-- The design system, exactly as the starter / tn-new-portal link it. No portal
     file and no design-system layer is touched by this page. -->
<link rel="stylesheet" href="design-system/talentnext-ds.css?b=0e1d3ba9">

<style>
/* HOST GEOMETRY ONLY. Every colour/size/space below is a token; the only extra
   is a 3-column override for the facts row. */
.host{
  position:relative;width:100%;height:100dvh;
  container-type:inline-size;container-name:app;
  overflow:hidden;background:var(--background)}

/* CARDS SIT DIRECTLY UNDER THEIR HEADING. The DS draws a hairline + 32px gap
   above every `.signed` block (`.sec > .signed{border-top;padding-top:--s07}`);
   this removes both so the Strengths/Growth and coaching rows pull up to the
   heading. */
.app .page .sec > .signed{border-top:0; padding-top:0}

/* ONE DIVIDER BETWEEN THE TWO SECTIONS — above Coaching guidance, inset by the
   page gutter like the product's own section rules. */
.app .page .sec.emp-divide{position:relative; padding-top:var(--s07)}
.app .page .sec.emp-divide::before{content:''; position:absolute; top:0;
  left:var(--pad-x); right:var(--pad-x); border-top:1px solid var(--rule)}

/* BRAND MARK ONLY. Hide the full wordmark; show just the chevron icon in the
   app bar's left cell, centred over the rail so it lines up with the rail icons. */
.app .shell-logo{display:none}
.app .nav-t-mark{display:grid; place-items:center}
.app .nav-t-menu{display:none}

/* CARD DETAILS. The Strong/Focus tags are rounded accent pills with white text;
   the icon sits closer to its content (gap reduced from --s05). */
.app .page .sig-tag{background:var(--accent); color:var(--on-accent); border-radius:999px}
.app .page .sig-c{gap:var(--s03)}

@container app (min-width:900px){
  .app .shell-act.nav-t{width:var(--rail-w-nav)}
  /* THE FACTS ROW IS THREE ACROSS. `.pf-facts` is a fixed FOUR-column grid at
     desktop (§105.1a); with three facts that leaves an empty cell, so this pins
     it to three, the way the admin's `.crs-facts` modifier does. */
  .app .facts.pf-facts.emp-facts{grid-template-columns:repeat(3,minmax(0,1fr))}
  .app .facts.pf-facts.emp-facts > div:last-child:nth-child(odd){grid-column:auto}

  /* LABEL-COLUMN OPT-OUT for the `.signed` sections (not on §10.15's auto list),
     restated in the container query as the starter documents — heading above
     content, exactly as the interview screen presents these cards. */
  .sec:has(> .signed){display:block;
    padding-left:var(--pad-x);padding-right:var(--pad-x)}
  .sec:has(> .signed) > .sec-h{
    border-right:0;min-height:0;margin-bottom:var(--s05);padding:0}
}
</style>
</head>
<body>

<div class="host" id="host">
  <div class="app" id="app"></div>
</div>

<script src="design-system/talentnext-ds.js?b=0e1d3ba9"></script>
<script>
/* This IS the Super Admin interview-detail page, with the employer's content:
   back arrow + title -> Employee / Talent agent / When facts (icons) -> the
   agent's evaluation (Strengths + Growth areas) -> Coaching guidance. Every
   component is the product's own — `.facts.pf-facts` cells, `dsAiHead` headings
   with descriptions, the `ivEvalBlock` cards with their tags — neutralised to the
   platform's black-and-grey.

   NOT SHOWN (client, slide 10): readiness alerts; any level, ladder, score or
   Tal level rationale; no Tal/AI evaluation. The owner sees development guidance. */

const OWNER = 'Marcus Reed';    /* signed-in franchise owner */
const EMP   = 'John Willson';   /* the employee they sponsored */
const AGENT = 'Derek Branch';   /* the talent agent who interviewed them */
const first = EMP.split(' ')[0];

const NAV = [
  ['dashboard', 'Dashboard', false],
  ['user',      'Employees', true],
  ['document',  'Reports',   false],
  ['settings',  'Settings',  false],
];

/* A facts cell, the admin's `admFact` shape: an inked icon + label, value below.
   `--mk` pinned to the ink token so the mark is black (no hue). */
const fact = (icon, label, val) =>
  `<div style="--mk:var(--text-primary)"><span class="l pf-l">${icon}${label}</span><span class="v">${val}</span></div>`;

/* A person value: a small round photo + the name, for the Employee / Talent agent
   facts. `.av-ph` is the DS photo disc (initials behind the image). */
const personVal = (name, img, ini) =>
  `<span class="v" style="display:flex;align-items:center;gap:var(--s03)"><span class="av-ph" style="width:24px;height:24px;flex:none"><i>${ini}</i><img src="${img}" alt=""></span>${name}</span>`;
const factPerson = (icon, label, valHtml) =>
  `<div style="--mk:var(--text-primary)"><span class="l pf-l">${icon}${label}</span>${valHtml}</div>`;

/* Strengths + Growth areas — the exact `ivEvalBlock` cards, tags kept, `--mk`
   inked so the whole card is black-and-grey (the tag reads as a grey chip). */
const evalBlock = `<div class="signed iv-eval">
    <div class="sig-pair">
      <div class="sig-c" style="--mk:var(--text-primary)"><i class="sig-ic">${I.starOutline}</i>
        <div class="sig-b"><div class="sig-top"><span class="sig-t">Strengths</span><span class="sig-tag">Strong</span></div>
          <p class="sig-p">${first} reasons from consequences to people, not policy. They can walk through a real reorganization call by call, with three worked examples that each carry a date and a name.</p></div></div>
      <div class="sig-c" style="--mk:var(--text-primary)"><i class="sig-ic">${I.growth}</i>
        <div class="sig-b"><div class="sig-top"><span class="sig-t">Growth areas</span><span class="sig-tag">Focus</span></div>
          <p class="sig-p">Delegation, and coaching rather than fixing. They still tend to solve a problem themselves where handing it to someone else, and developing them, would stretch them further.</p></div></div>
    </div>
  </div>`;

/* Coaching guidance — three moves the owner can bring into a 1:1, each with a
   line to actually say. Same `.sig-c` single card, ink, no tag. */
const COACHING = [
  ['Give them a problem to coach, not solve',
   `Next time something lands that a team member could own, ask ${first} to run the conversation and debrief with you after. Try: &ldquo;I&rsquo;d like you to take this one, then walk me through how it went.&rdquo;`],
  ['Name the delegation out loud',
   `They take work on quietly. In your next one-to-one, point to one thing you&rsquo;d like them to hand off and agree who picks it up. Try: &ldquo;What&rsquo;s one thing on your list someone else on the team could carry?&rdquo;`],
  ['Ask for the conversation they&rsquo;re putting off',
   `They are at their best reasoning from the people a decision affects. Ask about a hard conversation they have been avoiding and offer to prepare it together. Try: &ldquo;Which conversation have you been meaning to have but haven&rsquo;t yet?&rdquo;`],
];
const coachBlock = `<div class="signed">
    ${COACHING.map(([t, p]) => `<div class="sig-c" style="--mk:var(--text-primary)"><i class="sig-ic">${I.chat}</i>
      <div class="sig-b"><div class="sig-top"><span class="sig-t">${t}</span></div>
        <p class="sig-p">${p}</p></div></div>`).join('')}
  </div>`;

document.getElementById('app').innerHTML = `
  <header class="shell">
    <button class="shell-act nav-t" aria-label="Menu">
      <span class="nav-t-mark">${TN_MARK}</span>
      <span class="nav-t-menu">${I.menu}</span>
    </button>
    <a class="shell-logo"><img src="${LOGO_K}" alt="TalentNext"></a>
    <div class="shell-right">
      <button class="shell-act" aria-label="Notifications">${I.notification}</button>
      <span class="av sm shell-avatar av-ph"><i>MR</i><img src="${AV.hana}" alt=""></span>
    </div>
  </header>

  <div class="shell-body">
    <nav class="sidenav">
      <div class="sn-main">
        ${NAV.map(([ic, label, on]) => `<a class="sn-item${on ? ' on' : ''}">${I[ic]}<span>${label}</span></a>`).join('')}
      </div>
    </nav>
    <div class="scrim"></div>

    <main class="main">
      <div class="page">

        <div class="ph">
          <div class="ph-top">
            <button class="ph-back" aria-label="Back">${I.arrowLeft}</button>
          </div>
          <h1>Employee report</h1>
        </div>

        <section class="sec">
          <div class="facts pf-facts emp-facts">
            ${factPerson(I.user, 'Employee', personVal(EMP, AV.owen, 'JW'))}
            ${factPerson(I.user, 'Talent agent', personVal(AGENT, AV.samuel, 'DB'))}
            ${fact(I.calendar, 'When', '20 Aug 2026')}
          </div>
        </section>

        <section class="sec">
          ${dsAiHead({title: AGENT + '’s evaluation', desc: 'What the agent recorded after the interview.'})}
          ${evalBlock}
        </section>

        <section class="sec emp-divide">
          ${dsAiHead({title: 'Coaching guidance', desc: 'Ways to support ' + first + ' in your regular one-to-ones.'})}
          ${coachBlock}
        </section>

      </div>
    </main>
  </div>`;
</script>
</body>
</html>
