<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TalentNext Design System — reference</title>

<!-- THE WHOLE DEPENDENCY. Two files, and the fonts are inside the first. -->
<link rel="stylesheet" href="talentnext-ds.css?b=0e1d3ba9">

<style>
/* ==========================================================================
   THIS PAGE'S OWN CHROME — not part of the design system.
   Three things the DS deliberately does not carry: a host for the app frame,
   a code block, and a colour swatch. Everything else on this page is drawn
   with DS classes and nothing here overrides one.
   ========================================================================== */

/* 1. THE HOST.
   `.app` is `position:absolute; inset:0`, so it needs a positioned, sized
   parent — and that parent is also where `container-type` goes, because in
   this system NOTHING responds to the browser window. The breakpoints are
   `@container app (min-width:…)`, so they resolve against this box. Give the
   host the window's height and the app scrolls internally, which is the
   portal's own architecture. */
.ds-host{
  position:relative;width:100%;height:100vh;max-width:none;
  container-type:inline-size;container-name:app;
  overflow:hidden;background:var(--background);border:0}

/* 2. CODE. Scrolls inside its own box so a long line never widens the column. */
.doc-src{margin-top:var(--s04);border-top:1px solid var(--border-subtle-01)}
/* THE EYEBROW ROLE, TAKEN BY TOKEN. This page documents the system, so it has
   to obey it — "+ MARKUP" in capitals on the page that says nothing is set in
   capitals was the one thing here that could not be argued with. */
.doc-src summary{
  padding:var(--s03) 0;
  font-size:var(--t-eyebrow-size);line-height:var(--t-eyebrow-lh);
  font-weight:var(--t-w-strong);letter-spacing:var(--t-eyebrow-ls);
  color:var(--text-secondary);cursor:pointer;list-style:none}
.doc-src summary::-webkit-details-marker{display:none}
.doc-src summary::before{content:'+ ';font-weight:400}
.doc-src[open] summary::before{content:'– '}
.doc-src pre{
  margin:0 0 var(--s04);padding:var(--s04);overflow-x:auto;
  background:var(--layer-02);border-left:3px solid var(--border-strong-01);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11.5px;line-height:17px;color:var(--text-secondary);
  white-space:pre;tab-size:2}
.doc-ex{padding:var(--s05) 0;border-top:1px solid var(--border-subtle-01)}
.doc-ex:first-child{border-top:0;padding-top:0}
.doc-ex > .doc-t{
  display:block;margin-bottom:var(--s04);
  font-size:12.5px;font-weight:600;letter-spacing:.2px;color:var(--text-primary)}
.doc-ex > .doc-t small{
  display:block;margin-top:2px;font-weight:400;color:var(--text-helper);
  font-size:11.5px;letter-spacing:.2px}
.doc-live{display:block;--pad-x:0px}
/* WHY --pad-x:0 ABOVE. `.plate`, `.lvl-hero` and `.band` reach the column edge
   with a negative margin of `--pad-x`. Inside this page's own wrapper there is
   no column to reach, so they hung off both sides — the plate was rendering
   straight out of the content area, which is worse than not showing it at all.
   One declaration answers all of them; §35.1 does the same thing for a
   component borrowed into a Tal bubble. Do not chase the selectors. */

/* 3. SWATCHES. A token table, not a decoration: value and contrast in text,
   because the point is to be able to read the number. */
.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
  gap:1px;background:var(--border-subtle-01);border:1px solid var(--border-subtle-01)}
.sw-c{background:var(--layer-01);padding:0}
.sw-c i{display:block;height:52px}
.sw-c b,.sw-c span{display:block;padding:0 var(--s03)}
.sw-c b{margin-top:var(--s03);font-size:11.5px;font-weight:600;letter-spacing:.2px}
.sw-c span{padding-bottom:var(--s03);font-size:11px;color:var(--text-helper);
  font-family:ui-monospace,Menlo,monospace}

/* the icon sheet */
.ic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));
  gap:1px;background:var(--border-subtle-01);border:1px solid var(--border-subtle-01)}
.ic-c{background:var(--layer-01);padding:var(--s04) var(--s02);text-align:center}
.ic-c svg{width:22px;height:22px;fill:var(--icon-primary);margin:0 auto var(--s02)}
.ic-c span{font-size:10.5px;color:var(--text-helper);word-break:break-all;
  font-family:ui-monospace,Menlo,monospace}

/* THE MARK NEEDS A SIZE. `TN_MARK` carries a viewBox and no width/height —
   deliberately, so a call site can scale it — and §01's reset makes every svg
   `display:block; max-width:100%`. Given no size at all it collapses, so the
   host says how big it is. In the portal the logo is an <img>, which is why
   this does not come up there. */
.shell-logo{gap:var(--s03)}
.shell-logo svg{width:18px;height:18px;fill:var(--icon-primary);flex:none}
.shell-logo .wordmark{
  font-size:15px;font-weight:400;letter-spacing:-.2px;color:var(--text-primary);
  white-space:nowrap}

/* the spacing ruler */
.sp-row{display:flex;align-items:center;gap:var(--s04);padding:var(--s02) 0;
  font-size:12px;letter-spacing:.2px}
.sp-row i{display:block;height:12px;background:var(--brand-primary);flex:none}
.sp-row code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;
  color:var(--text-helper);min-width:44px}

/* 4. THE LABEL COLUMN, OPTED OUT — and this is worth reading, because it is
   the one piece of the system a new page is most likely to fight.

   §10.15 gives any `.sec` that has a `.sec-h` a 184px label column at desktop,
   with the heading in it and a vertical rule down its right. That is the
   product's reading pattern and it is correct there, because a section on a
   real page is short. A reference section is not: it holds six examples and
   runs 900px, and the heading — which is `display:flex; align-items:center`
   with `min-height:100%`, so it centres itself in whatever height the section
   turns out to be — ends up floating halfway down a rule with nothing beside
   it. Verified against the portal, which centres it the same way.

   So these sections opt out, and the opt-out has to be RESTATED INSIDE THE
   SAME CONTAINER QUERY. A container query is its own cascade tier: a rule
   inside `@container app` beats an unconditional rule of equal weight no
   matter which stylesheet came later, so writing this outside the query would
   simply lose. §36.9 does exactly this twice for the same reason.

   The six containers that get the opt-out for free — `.tile-stack`, `.stats`,
   `.tbl-wrap`, `.facts`, `.cardrow`, `.gcard` — are the reason a page built
   out of the system's own components never has to write this block. Build from
   those and the spine is free. `.doc-body` is a wrapper this page invented,
   which is precisely the case §10.15's list does not cover. */
@container app (min-width:900px){
  .sec:has(> .doc-body){
    display:block;padding-left:var(--pad-x);padding-right:var(--pad-x)}
  .sec:has(> .doc-body) > .sec-h{
    border-right:0;min-height:0;margin-bottom:var(--s05);padding:0}
  .sec:has(> .doc-body) > .doc-body{padding-left:0}
}

/* THE CALL DEMO'S FRAME. `.call` is `flex:1` inside `.app`, which is the whole
   window in a real portal and cannot be that here — the reference is a page of
   examples. A fixed-height flex column is the smallest thing that gives it
   somewhere to grow into, and the hairline says where the surface stops.
   Nothing in this rule is part of the component. */
.doc-live .call-demo{
  display:flex;flex-direction:column;height:440px;overflow:hidden;
  border:1px solid var(--border-subtle-01)}
</style>
</head>
<body>

<!-- The frame. `data-vp="fluid"` is the portal's own desktop frame marker. -->
<div class="device ds-host" id="host" data-vp="fluid">
  <div class="app" id="app">

    <!-- THE MARK IS THE MENU (§34). The toggle comes FIRST in the DOM,
         because that is the order a phone wants and the order a screen reader
         should hear — the control, then the link home. Open at desktop, §34
         gives `.shell-logo` `order:-1` so the wordmark holds the left end
         without the source order changing. Both glyphs are printed at every
         width; the container query decides which one shows. -->
    <header class="shell">
      <button class="shell-act nav-t" id="navBtn" data-toggle="nav" aria-label="Sections">
        <span class="nav-t-mark"></span>
        <span class="nav-t-menu"></span>
      </button>
      <a class="shell-logo" href="#top" id="logo" aria-label="TalentNext"></a>
      <div class="shell-right">
        <span class="shell-name">Design system</span>
      </div>
    </header>

    <div class="shell-body">
      <!-- no `.sn-cap` here on purpose: at desktop this is a 72px icon rail,
           and a caption has nowhere to go in 72px. The labels live in the
           `.sn-item`s and §14 reveals them when the rail expands. -->
      <nav class="sidenav" id="rail">
        <div class="sn-main" id="railItems"></div>
      </nav>
      <div class="scrim" id="scrim"></div>
      <main class="main" id="main">
        <div class="page" id="page"></div>
      </main>
    </div>

    <!-- the one overlay, so the sheet can be demonstrated for real -->
    <div class="modal" id="sheetModal">
      <div class="sheet">
        <div class="sheet-h">
          <h2>A bottom sheet</h2>
          <button class="x" id="sheetX" aria-label="Close"></button>
        </div>
        <div class="sheet-b">
          <label class="f">
            <span class="lbl">Full name</span>
            <input class="inp" value="Maryam Naz">
          </label>
          <p class="help">On a phone this rises from the bottom edge. At 600px
            and up it centres — one component, two anchors, stated once in §14.</p>
        </div>
        <div class="sheet-f">
          <button class="btn btn-s noic" data-close>Cancel</button>
          <button class="btn btn-p noic" data-close>Save</button>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="talentnext-ds.js?b=0e1d3ba9"></script>
<script>
/* ==========================================================================
   THE PAGE IS BUILT FROM A SPEC, so every example is written once and shows
   up twice: rendered, and as the markup that rendered it. A gallery whose
   snippets are re-typed beside the demo goes stale the first time one of
   them is corrected.
   ========================================================================== */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* trim the shared indent so the snippet reads as it would in a file */
function dedent(s){
  const lines = s.replace(/^\n/,'').replace(/\s+$/,'').split('\n');
  const pad = Math.min(...lines.filter(l => l.trim()).map(l => l.match(/^ */)[0].length));
  return lines.map(l => l.slice(pad)).join('\n');
}

/* ICONS ARE WRITTEN AS PLACEHOLDERS, and that is the whole reason this
   indirection exists. `${I.info}` inside the template would be expanded
   before `ex()` ever saw it, so the "markup" panel would show a 300-character
   SVG path where the reader needs to see the call they would type. So the
   examples say `{{info}}`, the live copy gets the real mark, and the snippet
   gets the call back. `{{name|class}}` is the path-only form, which is what
   the portal uses wherever the svg needs a class of its own. */
/* `{{av:priya}}` IS THE SAME TRICK FOR A FACE. The embedded portraits are
   base64 JPEGs a few hundred characters long, and a component that takes one
   as an inline `background-image` — the call's feed does — would otherwise
   print a wall of base64 where the reader needs to see `${AV.priya}`. Same
   split as the icons: the live copy gets the data URI, the snippet gets the
   call. It goes FIRST because its body contains a colon, which the bare
   `\w+` form below would not match anyway, but the order is what makes that
   independent of the next placeholder somebody adds. */
/* `{{aw:rank1}}` IS THE THIRD OF THE SAME TRICK, for the award artwork — the
   rank medals, the three badges and the points mark are embedded WebPs and a
   rank in a page header carries one twice (on the face and beside the
   sentence). Same split, same reason, and it sits beside the faces because the
   two behave identically. */
const fillLive = s => s
  .replace(/\{\{av:(\w+)\}\}/g, (_, n) => (typeof AV === 'object' && AV[n]) || '')
  .replace(/\{\{aw:(\w+)\}\}/g, (_, n) => (typeof AWARD === 'object' && AWARD[n]) || '')
/* AND `{{art:feed}}` FOR THE CALL'S OWN THREE PICTURES — the landscape
   still the feed is drawn on and the two faces beside it. Same split, same
   reason as the two above; `CALL_ART` is the table build-ds.py embeds. */
  .replace(/\{\{art:(\w+)\}\}/g, (_, n) => (typeof CALL_ART === 'object' && CALL_ART[n]) || '')
/* AND `{{ph:flame}}` FOR THE SECOND ICON FAMILY. `P` is Phosphor Duotone on
   its own 256 box (icons.js's head is the argument for why there are two sets
   and where the line between them runs), so it cannot go through the bare
   `{{name}}` form below — that one hands the name to `I` and would return an
   empty `<svg>` for a Phosphor key, silently. A prefix keeps the two families
   impossible to confuse in a snippet, which is the whole point of having
   drawn the line. */
  .replace(/\{\{ph:(\w+)\}\}/g, (_, n) => (typeof P === 'object' && P[n]) || '')
  .replace(/\{\{(\w+)\|([\w-]+)\}\}/g,
    (_, n, c) => `<svg class="${c}" viewBox="0 -960 960 960">${inner(n)}</svg>`)
  .replace(/\{\{(\w+)\}\}/g, (_, n) => I[n] || '');
const fillSrc = s => s
  .replace(/\{\{av:(\w+)\}\}/g, (_, n) => '${AV.' + n + '}')
  .replace(/\{\{aw:(\w+)\}\}/g, (_, n) => '${AWARD.' + n + '}')
  .replace(/\{\{art:(\w+)\}\}/g, (_, n) => '${CALL_ART.' + n + '}')
  .replace(/\{\{ph:(\w+)\}\}/g, (_, n) => '${P.' + n + '}')
  .replace(/\{\{(\w+)\|([\w-]+)\}\}/g,
    (_, n, c) => `<svg class="${c}" viewBox="0 -960 960 960">\${inner('${n}')}</svg>`)
  .replace(/\{\{(\w+)\}\}/g, (_, n) => '${I.' + n + '}');

/* one example: a title, the live thing, and its source. `noSrc` is for the
   generated sheets — a swatch grid's markup is a for-loop, not a component,
   and printing it would only bury the ones worth copying. */
function ex(title, note, html, noSrc){
  const src = dedent(html);
  return `<div class="doc-ex">
    <span class="doc-t">${title}${note ? `<small>${note}</small>` : ''}</span>
    <span class="doc-live">${fillLive(src)}</span>
    ${noSrc ? '' : `<details class="doc-src"><summary>markup</summary>
      <pre>${esc(fillSrc(src))}</pre></details>`}
  </div>`;
}

/* a section of the reference. Headings stay SHORT: at desktop a `.sec` with a
   `.sec-h` puts it in a 184px label column, and three words is two lines. */
function sec(id, heading, body, cls){
  return `<section class="sec${cls ? ' ' + cls : ''}" id="${id}">
    <div class="sec-h"><h2>${heading}</h2></div>
    <div class="doc-body">${body}</div></section>`;
}

const swatch = (name, val, note) => `<div class="sw-c">
  <i style="background:${val}"></i><b>${name}</b><span>${note || val}</span></div>`;

/* A FIGURE CELL, and all three parts are required. `.stat` is a named grid —
   `.stat-ic` sits in `grid-area:ic` — so a cell written without the icon does
   not merely lack a mark, it loses the area and the figures stop lining up.
   The mark colour is NOT chosen here: §29 cycles `--mk` over
   `nth-child(4n+1…4)` and the svg takes `fill:var(--mk)`, so the fourth cell
   is magenta because it is fourth. The mark is a BARE 20px glyph — the 28px
   tinted chip came off on 1 Sep 2026.
   Markup read off the running portal, not written from the CSS. */
const statCell = (icon, label, fig, note) => `<div class="stat">
      <span class="stat-ic">${I[icon] || ''}</span>
      <div class="stat-top"><div class="l">${label}</div><div class="n">${fig}</div></div>
      ${note ? `<div class="d">${note}</div>` : ''}
    </div>`;

const SECTIONS = [];

/* ---------------------------------------------------------------- how to use */
SECTIONS.push({id:'use', nav:'Using it', icon:'document', build: () => `
  ${ex('Two files', 'Fonts are embedded in the stylesheet, so there is nothing else to copy.', `
    <div class="note"><span>{{info}}</span><div class="nb"><b>In your &lt;head&gt;</b>
      &lt;link rel="stylesheet" href="design-system/talentnext-ds.css"&gt;<br>
      &lt;script src="design-system/talentnext-ds.js"&gt;&lt;/script&gt;</div></div>
  `)}
  ${ex('The host is required', 'Nothing in this system responds to the browser window — every breakpoint is a container query named <code>app</code>. Give the frame <code>container-type:inline-size</code> and <code>container-name:app</code> or the desktop layout never arrives.', `
    <div class="note warn"><span>{{warning}}</span><div class="nb"><b>The frame</b>
      &lt;div class="device" style="container-type:inline-size;container-name:app"&gt;<br>
      &nbsp;&nbsp;&lt;div class="app"&gt; … &lt;/div&gt;<br>
      &lt;/div&gt;<br>
      Or call <code>dsFrame(el)</code>. See starter.html for the whole skeleton.</div></div>
  `)}
  ${ex('Breakpoints', 'The three tiers the layers actually use.', `
    <div>
      <div class="kv"><span class="k">600px</span><span class="v">Gutter 24, sheets centre</span></div>
      <div class="kv"><span class="k">900px</span><span class="v">Permanent rail, label column</span></div>
      <div class="kv"><span class="k">1200px</span><span class="v">Rail 280, gutter 32</span></div>
    </div>
  `)}
`});

/* ---------------------------------------------------------------- signature */
/* THE COMPONENTS THAT CARRY THE LOOK, and the section that should have been
   here from the start. The first extraction dropped every one of these as
   "one product surface's own", which left a page that was correct and did not
   look like TalentNext. Their markup is FIXED — taken from views.js, not
   invented — because each has internal structure the CSS keys on, and getting
   it slightly wrong is what makes a component look broken rather than absent. */
SECTIONS.push({id:'signature', nav:'Signature', icon:'star', build: () => `
  ${ex('The dashboard head, whole', 'This is the opening move of the candidate portal and the thing a new portal most needs to match. The markup below is the <b>real DOM</b>, read off the running portal — not written from the CSS. Three parts inside one <code>.modhead</code>: the page header, one section holding Tal, and a <code>.sec.sec-dark</code> holding the plate. <b>The header carries the reader</b> — <code>.ph-you</code> puts a 75px face left of the <code>&lt;h1&gt;</code>, spanning the title and the fact row, with the rank medal on its corner; <code>.ph-rank</code> is a <b>sibling</b> of <code>.av-ph</code> and not a child, because §09 gives the avatar <code>overflow:hidden</code> and would clip anything hanging past the edge. The award line rides <code>.ph-act</code>, the slot §15 already keeps at the right-hand end of that row, and §62 lets the row <b>wrap</b> — under 360px of title block the sentence drops to its own line instead of breaking &ldquo;Welcome back, Maryam!&rdquo; over three. A rank does not go in the green <code>.ach</code> band: a badge is news you dismiss, a rank is what you now are. The wash (<code>.app .modhead::before</code>) covers all three, which is what makes it read as one band instead of three stacked blocks. <b>§56 arranges it as two columns</b> — the title, the <code>&middot;</code> fact row, a hairline, the steps, a second hairline and then what Tal says on the left; the plate beside all of it, content packed to the top and its actions on the foot, as tall as the column. The second column appears on its own: the gate is <code>.modhead:has(&gt; .sec-dark .plate)</code> at 900 and up, so a band whose dark card is a <code>.lvl-hero</code> or a <code>.cert</code> keeps the full-width place under the head. <b>The title is the <code>.ph</code>, not a greeting.</b> <code>.tal-greet</code> still works and still hides the <code>.ph</code> when you use it (§33.9) — the candidate portal chose the other shape, because with the fact row and the steps above Tal a greeting would be the fourth thing in the column. <b>Four things in the steps are easy to get wrong.</b> <code>.stps</code> is a column-flow grid and <b>each <code>.stps-i</code> paints the rail segment to its own right</b>, from its mark to the next one — there is no rail element to add, and adding a wrapper for one puts a line through the marks. The item is a <b>three-row grid</b> and <code>.stps-b</code> is <code>display:contents</code>, which is what keeps the state words on one line when a label wraps and another does not. A step is <code>.stps-m</code> + <code>.stps-b</code>: the step&rsquo;s own subject icon at every state, with the state on the <code>.stps-i</code> (<code>done</code> / <code>on</code> / neither) and the mark&rsquo;s <b>ground</b> carrying it — flat accent for done, the accent tint for the one you are on, the panel tone for what is ahead. That is the opposite of §33.7&rsquo;s dropdown, where the mark is a bare glyph because five filled tiles in a 340px panel read as buttons. And the <b>second divider is the wing&rsquo;s <code>border-bottom</code></b>, so it exists only where there are steps; below 900 the same markup turns 90 degrees into a column, the state word gives its line back to the step&rsquo;s own detail, and <code>.plate-b</code>&rsquo;s icon rows stay as they are.', `
    <div class="modhead">
      <div class="ph ph-has-act ph-you">
        <div class="ph-main">
          <span class="ph-you-av">
            <span class="av-ph"><i>MN</i><img src="{{av:hana}}" alt=""></span>
            <span class="ph-rank"><img src="{{aw:rank1}}" alt="1-Star rank"></span>
          </span>
          <div class="ph-top"><h1>Welcome back, Maryam!</h1></div>
          <p class="ph-facts">
            <span class="ph-f">{{growth}}<span>Explorer Track – E3</span></span>
            <span class="ph-f">{{group}}<span>Cohort 41</span></span>
            <span class="ph-f">{{calendar}}<span>Week 5 of 13</span></span>
          </p>
        </div>
        <div class="ph-act">
          <a class="ph-earned">
            <span class="ph-earned-mk"><img src="{{aw:rank1}}" alt=""></span>
            <span>You have earned 1-star <span class="ph-earned-u">rank!</span></span></a>
        </div>
      </div>
      <div class="sec">
        <div class="ai-aura tile tight talsum">
          <div class="ai-head"><span class="ai-label">Tal</span></div>
          <div class="ai-body"><p>Day 34 of 90, week 5. 5 of 13 chapters at 88%,
            260 minutes so far.</p></div>
          <div class="stp-wing">
            <div class="stp stp-open stp-titled">
              <div class="stp-top"><h2 class="u-h3">Your journey so far</h2></div>
              <ol class="stps">
                <li class="stps-i done"><span class="stps-m">{{chart}}</span>
                  <span class="stps-b"><span class="pi-lab">Leadership quiz</span>
                    <span class="stps-st">Completed</span>
                    <span class="pi-sec">Explorer track</span></span></li>
                <li class="stps-i done"><span class="stps-m">{{video}}</span>
                  <span class="stps-b"><span class="pi-lab">Interview and level</span>
                    <span class="stps-st">Completed</span>
                    <span class="pi-sec">E3 &middot; confirmed Aug 21</span></span></li>
                <li class="stps-i done"><span class="stps-m">{{group}}</span>
                  <span class="stps-b"><span class="pi-lab">Enrolled</span>
                    <span class="stps-st">Completed</span>
                    <span class="pi-sec">Cohort 41 &middot; started Aug 25</span></span></li>
                <li class="stps-i on" aria-current="step"><span class="stps-m">{{book}}</span>
                  <span class="stps-b"><span class="pi-lab">90-day course</span>
                    <span class="stps-st">In progress</span>
                    <span class="pi-sec">Week 5 of 13 &middot; 5 of 13 chapters done</span></span></li>
              </ol>
            </div>
          </div>
        </div>
      </div>
      <div class="sec sec-dark">
        <div class="plate" data-when="today 6:00 PM">
          <i class="dark-glow" aria-hidden="true"></i>
          <div class="plate-h plate-h-bare">
            <div class="plate-t">Cohort Week 36 Session</div>
            <span class="plate-when">{{time}}<b>today 6:00 PM</b></span>
          </div>

  ${ex('The same band, one priority down', 'The card above is black because the call is <b>today</b>. §59 says that is what the black ground and the warm haze are <i>for</i> — an action that is time-sensitive or wants attention now. Every other appointment gets the same card <b>quiet</b>: add <code>.plate-quiet</code> and the ground goes, <code>.dark-glow</code> is hidden, and a <b>vertical rule between the two columns</b> takes over the job the card&rsquo;s black edge was doing of saying where column one stops. Nothing else moves — same facts, same buttons, same order. <b>The ink flips by re-pointing three variables</b>, not by restating rules: <code>--on-dark</code>, <code>--on-dark-2</code> and <code>--on-dark-border</code> are reassigned on the card, so the eleven declarations §15, §21 and §56 write against them all follow, and so will anything you write. <b>Call <code>dsPlateQuiet(plate)</code> at the end of your render</b> and it decides for you: it reads the card&rsquo;s own <code>data-when</code>, its <code>.plate-when</code> chip and its <code>.plate-eb</code> label and looks for the vocabulary of inside-the-day — <i>now, today, tonight, starting,</i> or a count of hours or minutes. &ldquo;Due now&rdquo; is a label rather than a clock, which is why the label is tested too. <code>data-urgent="1"</code> or <code>="0"</code> on the card overrides it, and a card with no time at all is quiet, because nothing on it expires. Below 900 there is no second column, so the divider turns with the layout and becomes a hairline on the card&rsquo;s top edge.', `

  ${ex('The same card as an offer — three slots you have to write yourself', '§66. A plate that sells something rather than reminding you of an appointment, and all three additions are <b>markup</b> — there is no <code>.plate-enrol</code> and no flag, every rule gates on a condition in the DOM. <b><code>.plate-d</code> is the sentence under the title</b>: it takes the prose leading (22) against <code>.plate-b</code>&rsquo;s list leading (19) <i>at the same 13.5px</i>, which is the whole separation between a standfirst and a spec. Keep it to about <b>68 characters</b> — the card is 265 wide in a head band&rsquo;s column, so that is two lines, and a third reads as a paragraph. <b>A fact written as <code>Label &lt;b&gt;figure&lt;/b&gt;</code> becomes a label and a value</b>: write the <code>&lt;b&gt;</code> as <code>&lt;b class="plate-v"&gt;</code> and it holds the row&rsquo;s right edge in the accent. Two things follow from it and neither is optional — the list needs <code>align-items:stretch</code> to give the rows the card&rsquo;s full width, which is what <code>:has(.plate-v)</code> switches on and what any full-width rule between the rows would need, and the accent ink only applies on a <code>.plate-quiet</code> card, because <code>--accent-text</code> on §15&rsquo;s black ground is 1.6:1. <b>Where the hairlines go is an argument between two layers and §68 has the last word:</b> §66 rules under every fact row, §68 closes the four rows up and puts one rule above the date instead, on the ground that price, length, assessments and cohort shape are one list of one kind of thing and the date is the change of subject. What ships is §68&rsquo;s. A <code>&lt;b&gt;</code> in the <i>middle</i> of a fact is emphasis and stays inline. <b>The band is a <code>.note acc</code> wearing <code>.plate-n</code></b> — one element, component plus slot. In the portal <code>splitPlateBody</code> does the label/value lift for you from a <code>&middot;</code> run; a page with no render pass writes the rows out, exactly as it already writes <code>.plate-h</code> and <code>.plate-when</code>. <b>Watch the <code>order</code>:</b> a plate&rsquo;s children are ordered by an explicit list at each width, and a child no list names gets <code>order:0</code>, which is <i>above the head row</i>. These two share their neighbour&rsquo;s number and win on document order — so if you renumber the stack, renumber them with it. The <code>.acc</code> note is the system&rsquo;s tinted callout, <code>--accent-tint</code> with <code>--accent-on-2</code> as ink (4.68:1; the brand tint gives 4.40 and fails AA) — inside a plate §68 takes that ground off again, which is the one place the two disagree and the note there says why.', `

  ${ex('And the same card as an invoice — every row a figure, so the marks come off', '§69. The offer card above has <b>one</b> labelled figure among three plain facts, and there the mark in front of each row earns its 20px: it says what <i>kind</i> of thing the row is about, and the four rows are about four different things. A checkout is not that. Fee, credit and total are all money, <code>plateIcon</code> leads on money, and the card came out with a column of <b>three identical wallets</b> saying the same word over a list whose every row is a number. <b>The test is “is there a row here that is not a figure”</b> — nothing but labelled figures is a table of amounts. Add <code>.plate-tab</code> to the <code>.plate-b</code> and write the rows <b>with no icon</b>; in the portal <code>splitPlateBody</code> works this out for you and stamps the class, and a page with no render pass writes both, exactly as it already writes <code>.plate-h</code>. <b>Two things follow and both are automatic.</b> The last row is ruled off and gets a little air, because that is where every invoice in the world puts the line and because it says “the rows above add up to this” in a way no amount of ink can — it is drawn as a <code>border-top</code> in <code>--on-dark-rule</code>, so it is a hairline on a quiet card and white-at-16% on a black one. And <b>the accent goes to the total only</b>: §63 keeps <code>--accent-text</code> for <code>:last-child</code> and puts the working in the body ink, since three figures in the accent is the card shouting a number, then a second, then a third. The labels are <code>nowrap</code> with an ellipsis, so a long one cannot make one row two lines tall in a list whose whole point is that they line up.', `

  ${ex('A disclosure that still says something while it is shut', '§65 draws the disclosure and §69 adds one case to it. On the two dashboards that carry “What the interview found”, closed means <b>a heading and nothing else</b> — right there, because the heading <i>is</i> the summary of what is behind it. A block whose subject a reader may not know yet needs one line outside the panel: put an <code>.all-desc</code> between the head row and <code>.found-b</code> and it stays visible shut, so somebody who has read the detail once never has to open it again to be told what the block is. §69 gives the section its full bottom padding back in that case — §65 takes half of it away on the reasoning that a closed disclosure is one row, which stops being true the moment there are two. <b>The chevron is on the LEFT of the heading</b>, inside the button with the <code>&lt;h2&gt;</code>, and it points right when closed: a chevron at the far right of a <code>.sec-h</code> is 700px from its own words at desktop, and the row often already ends in an action. <b>Two things the CSS cannot do for you:</b> the toggle button must carry the growth the <code>&lt;h2&gt;</code> used to (<code>.found-t</code> does), and the state has to live outside the DOM if your page re-renders — a class on the section is gone at the next paint (trap 9).', `

  ${ex('Tal’s mark — two forms, and picking the wrong one shows', 'Inside a <code>.modhead</code>, <code>.ai-aura</code> takes <code>tile tight talsum</code> and <code>.ai-label</code> stays <b>plain</b>: §33 keys the 32px gradient disc on <code>.modhead .ai-aura.talsum > .ai-head > .ai-label::before</code>. <code>.bare</code> (§37) is the <b>16px fallback</b> for a page with no head band at all. Use <code>.bare</code> inside a band and you get a small dot where the disc belongs; use neither and you get the accent chip, which is what a portal built without this note came out with.', `

  ${ex('The summary types itself', 'The summary is the one line on a page that is <b>written rather than stored</b> — assembled from state at the moment you arrive — so it is said rather than already there. Nothing else at the head of a page does this: the <code>&lt;h1&gt;</code> is a label and was true before you got here. <b>You write the paragraph and hand it to <code>dsTypeSummary(p, key)</code> at the end of your render</b>; the helper does the rest. Two things it does that are worth knowing about. The paragraph is drawn <b>twice</b> — <code>.tsum-g</code> is the finished line at <code>visibility:hidden</code>, holding the final box open, and <code>.tsum-t</code> is the visible copy laid over it — because a typewriter that grows its own box shoves the whole page down mid-read. And <code>&lt;span class="tal-greet"&gt;</code> <b>does not type</b>: §33.9 hides the page&rsquo;s <code>.ph</code> when a greeting is present, so the greeting <i>is</i> that page&rsquo;s title, and a title that types itself in is a louder effect than a sentence that does. The <code>key</code> is &ldquo;which page am I on&rdquo; — the helper appends the words to it, so the line re-types when the page changes <i>or</i> when the reading does, and prints instantly on every other re-render. Pass <code>null</code> for the paragraph on a page that has no summary; that is how the next arrival is recognised as one.', `

  `)}
  ${ex('The plate belongs in the band', 'A plate reaches the column edge with a <b>negative margin</b> of <code>--pad-x</code>, and <code>.app .modhead .plate</code> zeroes it. So a plate inside a <code>.modhead</code> sits inset; a plate anywhere else bleeds full-bleed on purpose. Both are right — pick deliberately. Child order is fixed and <code>.plate-who</code> comes <b>last</b>: the avatar sits under the actions, not above them.', `

  ${ex('The week card and its ring', 'The ring is <b>two SVG circles</b>, not a conic gradient, and <code>--arc</code> is a stroke-dasharray <b>length</b>: r=26, so <code>arc = 163.36 × pct/100</code>. 17% is 27.8.', `

  ${ex('Three answers to one question', 'What to copy when a page is asking <b>"how am I doing"</b> and answering it in three parts — what I am on, whether that is enough, what it has earned. Drawn as three sections it does not compose: the reader gets a heading, a hairline and a screenful between each part, and has to hold the first to make sense of the third. One <code>.pulse</code> row puts them side by side in the order the question is asked. <b>Nothing in here is a new component</b>, and that is the point of the entry — the ring is <code>.ring</code>, the standing cells are <code>.stand</code>, the marks are the same 28px <code>.stat</code> chip in the same three named hues, the bar is the chapter rail with a different count. What <code>.pulse</code> states is the <b>grid that holds them</b> and the handful of places a component drawn for a full-width section has to change to live in a 290px column, which is the rearrangement a second portal wants and cannot work out from the components alone. Five things to copy exactly. <b>The head is <code>aiHead</code>, not this component</b> — see <b>The AI-native section head</b> below, which is the one block that states a heading, its description and the row&rsquo;s action together. This entry used to teach <code>.pulse-head</code> / <code>.pulse-ttl</code> / <code>.pulse-lede</code> / <code>.pulse-mk</code>, four classes §72 stated for its own head row before §73 generalised the shape; all four are <b>deleted</b>, and this recipe taught them for one build after the portal had stopped writing them. What matters here is only that the head is a <b>sibling</b> of <code>.pulse</code> rather than a child, and that the description is the one part written from the same figures the columns draw, so it can say what the three of them add up to. <b>The sparkle is <code>.aih-mk</code> and is deliberately not <code>.ai-label</code> or <code>.ai-aura</code></b>: it paints the same star in the same ramp, so the mark is identical to the one at the head of a band, but it carries no class any render pass looks for &mdash; wearing either of those two would hoist the whole section into the head band. It is <code>aiHead</code>&rsquo;s <code>mark</code> option, and a page carries <b>one</b>. That is what lets a hand-authored page use it without the section being hoisted into a head band. <b>The hue is an inline custom property</b> — <code>style="--mk:var(--mk-1)"</code> on each column — and that is the one inline style this system asks for: it is a token, not a layout value, so no stylesheet needs to answer it and a fourth column is a fourth hue rather than a fourth <code>nth-child</code> rule. It reaches further than the mark: the lit blocks of the pace bar take <code>var(--mk)</code> too, so a column is one colour throughout. <b>The track count counts the children</b>: <code>grid-auto-flow:column</code> and no <code>grid-template-columns</code>, so a page that emits two columns gets two — written as <code>repeat(3,1fr)</code> the survivors sit in the left two thirds with a hairline hanging in space. And the columns are <code>minmax(0,1fr)</code>, because a <code>1fr</code> floor is <code>auto</code> and the standing figures are <code>white-space:nowrap</code>, so they refuse to shrink and push the row wide. Two smaller ones: <code>.pulse-go</code> is pinned to the foot with <code>margin-top:auto</code> so the columns\' buttons line up whatever their content does, and if your page has a <code>.sec-h</code> above this, note the label column — <code>.pulse</code> is a wrapper and gets the 184px spine unless the opt-out is restated for it.', `
    <div class="sec">
    <div class="sec-h aih">
      <div class="aih-b">
        <h2 class="aih-t"><i class="aih-mk"></i>Your learning pulse</h2>
        <p class="aih-d">You have completed <b>12 of 70 minutes</b> for <span class="pulse-hl">Delegation Without Drop-Off</span>, which is all the time you have spent learning this week. Complete chapter 4 to stay on the pace.</p>
      </div>
      <div class="aih-a">
        <button class="btn btn-p btn-sm" type="button">Open chapter 4 {{arrowRight}}</button>
      </div>
    </div>
    <div class="pulse">
      <div class="pulse-c" style="--mk:var(--mk-1)">
        <div class="pulse-h"><i class="pulse-ic">{{book}}</i><span class="pulse-lab">Current focus</span></div>
        <h3 class="pulse-t">Delegation Without Drop-Off</h3>
        <div class="pulse-eb">Chapter 4 &middot; In progress</div>
        <div class="pulse-ring">
          <div class="ring" role="img" aria-label="17% of chapter 4 done">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <circle class="ring-t" cx="32" cy="32" r="26"></circle>

  ${ex('The AI-native section head', 'One block for <b>a heading, its description and the row&rsquo;s actions</b>, and the only reason it is its own entry is that three sections in one portal drifted three ways without it. Copy this shape for any section whose heading needs a sentence under it. <b>The structural point is the box, not the margins</b>, and that is the bug measuring could not find: the wrong version put the title and the actions in the <code>.sec-h</code> and left the description as the section&rsquo;s <i>next</i> child. An action group is 40px tall and a 16px title&rsquo;s line box is 22, so the row took 40, the title sat centred in it, and there were 9px of empty row under the title before its own margin began. The gaps computed to exactly the specified 12 and 20 and the heading still read as detached from its own description. Here the title and the description are <b>one flex item</b> (<code>.aih-b</code>) and the action group is centred against the <b>pair</b>. <b>The block is capped at 60%</b> so the description wraps clear of the action — uncapped it grows into every pixel the buttons are not using, and a derived sentence ran 890px to a few characters short of the button, 150 characters on one line where the type system wants about 75. <b>The centring needs <code>align-self:center</code> stated on both children</b>, and <code>align-items:center</code> on the row is not enough — an earlier layer top-aligns every child of a <code>.sec-h</code>, excluding only rows whose control is a <i>direct</i> child, which this one&rsquo;s is not. It shipped top-aligned for a build because the file&rsquo;s specified 14px offset <i>is</i> the centred offset for a 68px block and a 40px action, so the gap between the two tops measures correctly in both states. The test that separates them is the <b>mid-points</b>, not the tops. <b>And the 340px flex-basis is the wrap mechanism</b>, not padding — a flex item only moves to a new line when its <i>base</i> size does not fit, so with <code>auto</code> the block shrank to nothing instead of wrapping and the title set one word to a line on a phone without ever overflowing. <b>The mark is optional and a page gets one.</b> <code>.aih-mk</code> is 12px and does <b>not</b> track the heading&rsquo;s size — below the cap height of the words it reads as a bullet introducing the line, above it as a second object competing with it, so it is one value everywhere. It is deliberately neither <code>.ai-label</code> nor <code>.ai-aura</code>: both of those are claimed by the render passes that build the head band, so a section wearing one gets hoisted out of the page. <b>Two spacing rules to keep:</b> a chip beside a button is <code>align-self:center</code> at a stated 40px height and never <code>stretch</code> — stretch takes the height of the flex <i>line</i>, which these rows set from the text block, so a chip came out 85px against a 40px button and dragged the group to 133. And if the section sits under a heading at desktop, check the 184px label column: <code>.aih</code> is a wrapper, so a new section around it loses whatever opt-out its old contents were getting for free.', `

      <div class="sec-h aih">

          <h2 class="aih-t"><i class="aih-mk"></i>You&rsquo;re enrolling on Explorer &ndash; E3</h2>

      <div class="facts eo-facts">
        <div><i class="eo-fi">{{wallet}}</i>
          <span class="eo-fb"><span class="eo-fl">Course fee</span>
            <span class="eo-fv eo-fv-acc">$690</span></span></div>
        <div><i class="eo-fi">{{book}}</i>
          <span class="eo-fb"><span class="eo-fl">Chapters</span>
            <span class="eo-fv">13, one a week</span></span></div>
        <div><i class="eo-fi">{{group}}</i>

            <span class="eo-fv">10 learners</span></span></div>

  ${ex('The same head, without the mark', 'The mark is the only difference, and the two examples together are the rule: <b>one star per page</b>. A section that is the product listing something rather than the assistant reading it takes a plain heading. Everything else is identical, which is the point of there being one component. Under it, the other shape §73 draws: a <b>content-sized figure row</b> and a <b>card scroller</b>. <b>The figure row is still <code>.facts</code> and the class is load-bearing</b> — the desktop label-column opt-out names it, so a headed section carrying one keeps the page spine with no extra rule — but almost everything <code>.facts</code> normally gives it is overridden: the cells are content-sized with the dividers centred in the gaps, rather than four equal columns that would put &ldquo;Cohort of 10&rdquo; in the same width as &ldquo;$690&rdquo;. <b>Three dividers needs three elements and a grid container has two</b>, so the row carries <code>::before</code> and <code>::after</code> and the third cell carries its own, positioned out into the gutter beside it. <b>Two rows a cell, and the label is the strong one</b> — that inverts a figure cell deliberately: these four are not figures being compared, they are four different things, and what you scan is the names. One accent string, on the value that is money. <b>The scroller becomes a grid at 900 and its dividers must be switched off, not re-pointed</b>, below it — they are absolutely positioned into named tracks, so a stacked row draws a vertical line down every cell but the first. Same trap as the figure row: at mobile the whole action group goes full width and stacks, because a fixed 254 + 8 + 185 group is a 447px base against a 358px page and nothing can give.', `

  ${ex('A write-up as three findings', 'What to copy when a block is <b>read rather than acted on</b> and its parts are different <i>kinds</i>. This was four paragraphs and two grey labels: the two things a reader most wants to compare &mdash; what you are good at and what you are not &mdash; sat 400px apart in one column, and nothing in the drawing said they were different kinds of claim. Three cards in three of the named marker hues: <b>green for the strengths, violet for the growth areas, blue for the assessor&rsquo;s own note</b>, with the pair abreast and the note under them. <b>Not the accent, and that is the instruction</b> (Maryam, 31 Aug 2026: &ldquo;do not go for orange color only&rdquo;) &mdash; the accent is the assistant&rsquo;s voice and the page&rsquo;s one CTA, and this is the product reporting what a <i>person</i> found. <b>The section has to be white.</b> This lived in a tinted panel, and a 5%-tinted card on a 4% grey ground is two washes a shade apart: the green and the violet vanished and the row read as three empty boxes. White panel, coloured cards. <b>Three mixes from one <code>--mk</code>, and the numbers matter</b>: 5% for the card, 12% for the 28px chip, 14% for the tag. Across a 430px card the chip&rsquo;s 12% is a colour rather than a wash, and three of them read as three status banners. <b>This is the one place a filled chip is right</b> &mdash; the pulse and the offer both went to bare glyphs, because their marks sit inside a bordered cell or beside a column rule where a filled square is a box in a box; here the card <i>is</i> the wash and the chip is a denser patch of it. <b>The card title takes the hue and every other word stays in ink</b>, which is the opposite of the pulse&rsquo;s column labels, and the ground is the difference: there the mark sits on white so a coloured word beside it reads as a status pill, here the card is that hue and the title in it is the card naming itself. One more: the header is <b>two facts with a rule between them</b>, and the name block needs <code>flex:none</code> &mdash; inherited <code>flex:1</code> absorbs the row and throws the date to the far edge, which reads as two unrelated facts rather than a pair.', `

  ${ex('Outline', 'The accordion as a list of openable things: a title over a meta line, a hover label, panels that hold <b>blocks</b> rather than prose, and a closing row that does not open. <b>Point at a row</b> — <code>.ol-row:hover</code> is one of the eleven hovers <code>build.py</code> leaves armed, and the label is <code>display:none</code> rather than <code>visibility:hidden</code> so the chevron does not sit behind a phantom gap. Four things to copy: <code>.ol</code> releases <code>.acc-b</code>’s 68ch prose measure, the panel’s <b>first</b> <code>.skl-h</code> drops §87.1c’s divider, and a headed <code>.sec</code> holding one needs §110.5’s label-column opt-out or the heading sets in a 184px gutter.', `
    <div class="acc ol" id="demoOl">
      <div class="acc-i on">
        <button class="acc-h ol-row" aria-expanded="true">
          <span class="ttl"><span class="ol-t">Why We Exist</span><span class="ol-m t-desc">Chapter 1 &middot; 45 min</span></span>
          <span class="ol-cd">Chapter details</span>
          {{chevDown|chev}}</button>
        <div class="acc-b">
          <h3 class="skl-h">What you&rsquo;ll learn</h3>
          <ul class="lrn">
            <li class="lrn-i"><span class="lrn-tk">{{check}}</span><span class="lrn-t">Say what the business is for in one sentence other people repeat</span></li>
            <li class="lrn-i"><span class="lrn-tk">{{check}}</span><span class="lrn-t">Trace your own work back to the outcome it is paid for</span></li>
          </ul>
          <h3 class="skl-h">Skills you&rsquo;ll gain</h3>
          <div class="skl">
            <span class="skl-c">Purpose</span>
            <span class="skl-c">Business literacy</span>
            <span class="skl-c">Strategic context</span>
          </div>
        </div>
      </div>
      <div class="acc-i">
        <button class="acc-h ol-row" aria-expanded="false">
          <span class="ttl"><span class="ol-t">The Operator Mindset</span><span class="ol-m t-desc">Chapter 2 &middot; 60 min</span></span>
          <span class="ol-cd">Chapter details</span>
          {{chevDown|chev}}</button>
        <div class="acc-b"></div>
      </div>
      <div class="acc-i ol-cert">
        <div class="cardrow">
          <span class="cardrow-ic">{{certificate}}</span>
          <span class="cardrow-b">
            <span class="cardrow-t">Earn your certificate</span>
            <span class="cardrow-d">A row with no <code>.acc-h</code> in it does not open, so it needs no chevron.</span>
          </span>
        </div>
      </div>
    </div>
  `)}
  ${ex('Sheet', 'Rises from the bottom on a phone, centres at 600px and up.', `
    <button class="btn btn-s noic" id="openSheet">Open the sheet</button>
  `)}
  ${''/* THE CONFIRMATION IS A SECOND SHAPE OF THE SAME COMPONENT, and it was
        missing from this page for two callers — §105.6 drew it for "Delete
        your account?" and §109 for "Successfully enrolled", and until now the
        box shipped every `.conf-*` rule with nothing here writing one. That is
        the "gate nothing writes" tell read from the gallery's side: the CSS
        crossed, the recipe did not, so a hand-authored page had no way to know
        the shape existed.

        THE `.modal on` WRAPPER IS THE ONE LINE THE GALLERY OWNS. In a product
        the modal is `position:absolute; inset:0` over the app with a scrim
        behind it — the Sheet example above shows that for real. Here it is
        `position:static` so the dialog can stand in the page and be read; the
        `.sheet.conf` inside it is the component, unchanged. */}
  ${ex('Confirmation — something worked', 'The centred dialog, and the only difference from the destructive one below it is <code>.conf-ok</code> on the sheet: the mark takes <code>--support-success</code>. Everything else — the 48px disc, its two hairline rings, the 16px title, the sentence at <code>--sec-desc-gap</code> under it, no rule above the footer, no trailing arrow on the action — is the component. One action, because there is nothing to decide.', `
    <div class="modal on" style="position:static">
      <div class="sheet conf conf-ok" role="dialog" aria-modal="true" aria-label="Successfully enrolled">
        <div class="sheet-b conf-b">
          <span class="conf-mk">{{checkFilled}}</span>
          <h2 class="conf-t">Successfully enrolled</h2>
          <p class="conf-x">$595 paid on your Visa ending 4242, and Cohort 41 is
            yours for the 90 days.</p>
        </div>
        <div class="sheet-f conf-a">
          <button class="btn btn-s noic">Close</button>
        </div>
      </div>
    </div>
  `)}
  ${ex('Confirmation — something is about to be destroyed', 'Same object without <code>.conf-ok</code>. Two equal halves in the footer, the safe exit first, and <b>no × in the corner</b> — a dialog whose point is a deliberate choice does not get a third, quietest way out. The friction field is <code>.conf-f</code>, which takes §41’s bounded box rather than the product’s underline: a grey word hard-left under a centred heading reads as a value already typed.', `
    <div class="modal on" style="position:static">
      <div class="sheet conf" role="dialog" aria-modal="true" aria-label="Delete your account">
        <div class="sheet-b conf-b">
          <span class="conf-mk">{{warning}}</span>
          <h2 class="conf-t">Delete your account?</h2>
          <p class="conf-x">Your profile, your notes and every interview recording
            are deleted. This cannot be undone.</p>
          <div class="f conf-f">
            <label for="galdelc">Type Delete to confirm</label>
            <input class="inp" id="galdelc" placeholder="Delete" autocomplete="off">
          </div>
        </div>
        <div class="sheet-f conf-a">
          <button class="btn btn-s noic">Keep my account</button>
          <button class="btn btn-p noic danger">Delete Account</button>
        </div>
      </div>
    </div>
  `)}
  ${ex('The rail as a tree', 'The Super Admin\'s rail (§120.1): a module row carries the sum of its queue counts in the rail\'s own <code>.badge</code>, and while the rail is open the module you are in lists its sub-pages as <code>.sn-item.sn-sub</code> rows inside <code>.sn-subs</code>, indented to the label above. <b>The render gates the block, not the CSS</b> — a shut 72px rail hides every label, so the sub-rows are only emitted while the rail is open. One accent bar: the module keeps it, the sub-row\'s is off and its accent ink (§63 §51) says which page you are on.', `
    <nav class="sidenav on" style="position:static;transform:none;width:260px;height:auto">
      <div class="sn-main">
        <button class="sn-item">{{dashboard}}<span>Dashboard</span></button>
        <button class="sn-item on">{{group}}<span>Users &amp; Roles</span></button>
        <div class="sn-subs">
          <button class="sn-item sn-sub"><span>All Users</span></button>
          <button class="sn-item sn-sub on"><span>Roles &amp; Permissions</span></button>
        </div>
        <button class="sn-item">{{shield}}<span>Vetting &amp; Approvals</span><span class="badge">8</span></button>
      </div>
    </nav>
  `)}
`});

/* -------------------------------------------------------------------- icons */
SECTIONS.push({id:'icons', nav:'Icons', icon:'star', build: () => `
  ${ex('The set', 'Material <b>Symbols</b>, the <b>Rounded</b> style at <b>FILL&nbsp;0</b> — Google’s current library, linear, one tone and one path each, pasted from <code>google/material-design-icons</code>. Call one as <code>I.name</code> for a whole &lt;svg&gt;, or <code>inner(\'name\')</code> for the path alone — and if you wrap <code>inner()</code> yourself the box is <code>viewBox="0 -960 960 960"</code>, not the 24 grid, or the mark renders as an invisible speck in the corner.<br><br><b>Four marks are filled, because fill is a STATE axis and not a style</b> — Google’s own definition of it. The set sits at FILL&nbsp;0 and flips to 1 to say “this one is on”: <code>star</code>&nbsp;/&nbsp;<code>starOutline</code> (a rating’s lit and unlit slots), <code>checkFilled</code> (done, against <code>checkOutline</code>’s not-done) and <code>stopFilled</code> (a solid dot). The test for a fifth is whether the <em>same glyph also appears unfilled</em> and the difference is the information — which is why <code>trophy</code>, <code>certificate</code> and <code>shield</code> stay linear: they are subject marks and never appear both ways.', `
    <div class="ic-grid">${Object.keys(IP).sort().map(k =>
      `<div class="ic-c">${I[k]}<span>${k}</span></div>`).join('')}</div>
  `, true)}
  ${ex('The brand marks', '<code>TN_MARK</code> is the logo lockup at the logo’s own proportions — it is deliberately not redrawn on the 24 grid, because that is how a logo drifts. <code>CHEV</code> is the single chevron the product draws headings and levels with.', `
    <div style="display:flex;align-items:center;gap:var(--s07)">
      <span style="width:44px;fill:var(--icon-primary)">${TN_MARK}</span>
      <svg viewBox="0 0 24 24" style="width:22px;fill:var(--accent-text)"><path d="${CHEV}"/></svg>
    </div>
  `, true)}
`});

/* ------------------------------------------------------------------- motion */
SECTIONS.push({id:'motion', nav:'Motion', icon:'play', build: () => `
  ${ex('The rules', 'Motion explains, it does not decorate: a page rises because it arrived from below the fold, a drawer slides from the edge it lives on. It fires on events, never on renders — every entrance is gated on <code>[data-enter]</code>, which is a ONE-RENDER marker.', `
    <div>
      <div class="kv"><span class="k">State change</span><span class="v">--mo-quick, 150ms</span></div>
      <div class="kv"><span class="k">Arriving</span><span class="v">--mo-base, 240ms</span></div>
      <div class="kv"><span class="k">Full overlay</span><span class="v">--mo-slow, 320ms</span></div>
      <div class="kv"><span class="k">Cascade</span><span class="v">26ms a step, stops at 8</span></div>
    </div>
  `)}
  ${ex('Replay the entrance', 'The sections stagger off <code>--i</code>, which the page stamps. <code>prefers-reduced-motion</code> collapses all of it to a 120ms cross-fade.', `
    <button class="btn btn-s noic" id="replay">Play it again</button>
  `)}
  ${ex('Two traps', '', `
    <div class="tile-stack">
      <div class="note warn"><span>{{warning}}</span><div class="nb">
        <b>Never state a resting style with opacity</b>
        Entrance animations run with <code>fill-mode:both</code>, so a played
        animation’s last keyframe keeps applying and wins. Put the weight in
        <code>background-color</code> instead.</div></div>
      <div class="note warn"><span>{{warning}}</span><div class="nb">
        <b>Do not measure geometry in the same tick as a render</b>
        The entrance translates and scales, so a width read straight after can
        be off by orders of magnitude. Kill the animation or wait for it.</div></div>
    </div>
  `)}
`});

/* ==========================================================================
   RENDER
   ========================================================================== */
const page = document.getElementById('page');
const rail = document.getElementById('railItems');
const app  = document.getElementById('app');

/* The portal's wordmark is an image asset that is not part of the design
   system, so this sets the mark plus the name as text. §34 sizes the mark
   inside `.nav-t-mark` to 21px — deliberately smaller than the 24px
   hamburger it swaps with, because three thin chevrons read heavier than a
   Material glyph at the same size. */
document.getElementById('logo').innerHTML =
  `${TN_MARK}<b class="wordmark">TalentNext</b>`;
document.querySelector('#navBtn .nav-t-mark').innerHTML = TN_MARK;
document.querySelector('#navBtn .nav-t-menu').innerHTML = I.menu;
document.getElementById('sheetX').innerHTML = I.close;

page.innerHTML = `
  <div class="ph" id="top">
    <span class="eyebrow">TalentNext</span>
    <h1>The design system</h1>
    <p class="lead">Every class below is a real rule from the hi-fi candidate
      portal, extracted in its own cascade position — so a page built on these
      names comes out looking like that portal rather than like an
      approximation of it. Two files, no build step, nothing to re-draw.</p>
  </div>
  ${SECTIONS.map(s => sec(s.id, s.nav, s.build())).join('')}
  <div class="sec">
    <p class="help">Generated from <code>hifi/build/*.css</code> by
      <code>design-system/build-ds.py</code>. To change the system, change the
      layer that states the rule — the reasoning for it is the comment above
      it — then re-run the build.</p>
  </div>`;

rail.innerHTML = SECTIONS.map((s,i) =>
  `<a class="sn-item${i === 0 ? ' on' : ''}" href="#${s.id}" data-sec="${s.id}">
     ${I[s.icon]}<span>${s.nav}</span></a>`).join('');

dsStagger(page);
dsEnter(app);

/* --- the rail, and the phone drawer ------------------------------------- */
const railEl = document.getElementById('rail');
const scrim  = document.getElementById('scrim');

/* ONE FLAG, TWO BEHAVIOURS, and both have to be set — which is what the
   portal's own render does (`views.js` stamps `data-rail` and `.on` from the
   same `S.nav`). Below 900 the rail is a temporary drawer over a scrim, so it
   needs `.on`; at 900 and up it is a permanent 72px icon rail that widens to
   `--drawer-w` on `data-rail="open"`, revealing the `.sn-item` labels §14
   otherwise clips to 1px. The stylesheet decides which one applies at this
   width; the page just tells it the state. */
function setNav(open){
  railEl.classList.toggle('on', open);
  scrim.classList.toggle('on', open);
  app.setAttribute('data-rail', open ? 'open' : 'shut');
  /* `data-open` is a ONE-RENDER marker and only motion may read it (trap 5).
     Left set, `mo-drawer` runs with `fill-mode:both` and its final keyframe
     keeps applying to the rail's transform for as long as the flag is there —
     which is the same class of bug as styling a resting state with opacity.
     The persistent state is `data-rail` and `.on`; this is just the cue.

     It is cleared when the entrance has finished rather than on the next
     frame — `mo-drawer` is 320ms (--mo-slow) and pulling the flag two frames
     in would cancel the slide it exists to start. */
  clearTimeout(setNav.t);
  if(open){
    app.setAttribute('data-open', 'nav');
    setNav.t = setTimeout(() => app.removeAttribute('data-open'), 380);
  } else {
    app.removeAttribute('data-open');
  }
}
setNav(false);
document.getElementById('navBtn').onclick = () => setNav(!railEl.classList.contains('on'));
scrim.onclick = () => setNav(false);
rail.onclick = e => {
  const a = e.target.closest('.sn-item');
  if(!a) return;
  rail.querySelectorAll('.sn-item').forEach(x => x.classList.toggle('on', x === a));
  setNav(false);
};

/* mark the section you are in — the rail is the one place that says where you
   are, so it has to keep up with the scroller rather than only with clicks */
const main = document.getElementById('main');
const io = new IntersectionObserver(entries => {
  entries.filter(e => e.isIntersecting).slice(0,1).forEach(e => {
    rail.querySelectorAll('.sn-item').forEach(x =>
      x.classList.toggle('on', x.dataset.sec === e.target.id));
  });
}, {root: main, rootMargin: '-20% 0px -70% 0px'});
SECTIONS.forEach(s => { const el = document.getElementById(s.id); if(el) io.observe(el); });

/* --- the demos ---------------------------------------------------------- */
document.querySelectorAll('#demoTabs, #demoSeg').forEach(g => g.onclick = e => {
  const b = e.target.closest('button');
  if(b) g.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
});
document.getElementById('demoAcc').onclick = e => {
  const h = e.target.closest('.acc-h');
  if(h) h.parentElement.classList.toggle('on');
};
/* THE OUTLINE DEMO OPENS ONE ROW AT A TIME, which is what the portal's own
   `data-outl` handler does — and the portal keeps the open row in `S.outl` as
   well, because its page re-renders under the reader (§65's split). A
   hand-authored page that never re-renders needs only this. */
document.getElementById('demoOl').onclick = e => {
  const h = e.target.closest('.ol-row');
  if(!h) return;
  const item = h.parentElement, was = item.classList.contains('on');
  document.getElementById('demoOl').querySelectorAll('.acc-i.on')
    .forEach(x => { x.classList.remove('on'); x.querySelector('.ol-row')?.setAttribute('aria-expanded','false'); });
  if(!was){ item.classList.add('on'); h.setAttribute('aria-expanded','true'); }
};
const modal = document.getElementById('sheetModal');
function sheet(open){
  modal.classList.toggle('on', open);
  app.setAttribute('data-open', open ? 'editProfile' : '');
}
document.getElementById('openSheet').onclick = () => sheet(true);
modal.onclick = e => { if(e.target === modal || e.target.closest('[data-close],.x')) sheet(false); };
document.getElementById('replay').onclick = () => { dsStagger(page); dsEnter(app); };

/* THE SUMMARY, TYPED — the one demo on this page that has to be RE-armed to be
   seen twice. `dsTypeSummary` runs once per arrival by design, and its key is
   "which page am I on" plus the words; on a single-page reference neither ever
   changes, so a second call is correctly a no-op. Clearing `DS_SUM.key` is
   what tells it this is a new arrival — the same thing a real portal gets for
   free by navigating.

   It is deliberately NOT wired to the section scroll: a line that re-types
   every time it comes back into view is a page that will not sit still. */
/* THE ROSE, DRAWN. `dsQuizRose` returns the whole component out of an array
   and a number, so the example's markup is a host and one line — there is no
   hand-written version of this to show. */
const roseDemo = document.getElementById('roseDemo');
if(roseDemo) roseDemo.innerHTML = dsQuizRose(
  [['Decisiveness',78],['Delegation',41],['Directness',66],['Coaching',38],['Composure',84]], 64);

const tsumDemo = document.getElementById('tsumDemo');
if(tsumDemo){
  const typeDemo = () => { DS_SUM.key = null; dsTypeSummary(tsumDemo, 'gallery'); };
  typeDemo();
  document.getElementById('tsumReplay').onclick = typeDemo;
}
</script>
</body>
