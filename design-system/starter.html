<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TalentNext — new portal (starter)</title>

<!-- ==========================================================================
     THE DESIGN SYSTEM. Two files, and the fonts are inside the first, so this
     is the whole dependency. Serve over http — a browser blocks a linked
     stylesheet on file://, which is the same rule the hi-fi portal follows:
         python3 -m http.server 8799 --bind 127.0.0.1
     ========================================================================== -->
<link rel="stylesheet" href="talentnext-ds.css?b=0e1d3ba9">

<style>
/* ==========================================================================
   THIS PAGE'S ONLY CSS, and it is four declarations of host geometry rather
   than design. If you find yourself adding a colour, a size or a spacing
   here, the token for it already exists — see gallery.html.

   THE HOST IS NOT OPTIONAL. `.app` is `position:absolute; inset:0`, so it
   needs a positioned parent with a height. And `container-type` has to be
   here because NOTHING in this system responds to the browser window: every
   breakpoint is `@container app (min-width:…)` and resolves against this box.
   Leave it off and the page renders at its phone layout at every width.

   `height:100dvh` makes `.main` the scroller rather than the document, which
   is what keeps the app bar and the rail still while the page moves — the
   portal's own architecture.
   ========================================================================== */
.host{
  position:relative;width:100%;height:100dvh;
  container-type:inline-size;container-name:app;
  overflow:hidden;background:var(--background)}

/* Nothing. The wordmark is a real asset now — `LOGO_K` in talentnext-ds.js?b=8f52743f —
   and §01 already sizes it: `.shell-logo img{height:17px}`, 19px at desktop. */
</style>
</head>
<body>

<div class="host" id="host">
  <div class="app" id="app"></div>
</div>

<script src="talentnext-ds.js?b=0e1d3ba9"></script>
<script>
/* ==========================================================================
   A NEW PORTAL, IN THE SHAPE THE HI-FI ONE USES
   One state object, one view registry, one render. That is the whole engine —
   the portal's own is the same three things with fifteen files of views on top
   of it. Adding a page is: write a function that returns the page's HTML, put
   it in `V`, add a line to `NAV`. Nothing else.

   Every class named below is in the design system. Look them up in
   gallery.html rather than inventing a new one: a wrapper this system has not
   met is the one thing that reliably breaks the desktop layout (see the
   label-column note at the foot of this file).
   ========================================================================== */

const S = { view: 'home', nav: false };

/* ---------------------------------------------------------------- the pages */
const V = {};

V.home = () => `
  <!-- THE HEAD BAND IS WHERE THE GRADIENT LIVES, and the wrapper is the whole
       trick: ".app .modhead::before" paints a pair of radial gradients in
       "--tal-chip-2", so any page that wraps its head in "modhead" gets the
       warm-to-green wash the candidate portal opens with. The portal builds
       this wrapper with a JS pass, which made it look JS-only. It is not.
       It draws its own closing hairline too, so do not add one. -->
  <div class="modhead">
    <div class="ph">
      <span class="eyebrow">Cohort 41</span>
      <h1>Good morning, Maryam</h1>
      <p class="lead">This is a page header. One per page, and it carries the
        only h1. Everything under it is a section.</p>
    </div>

  <!-- TAL'S BAND, AND NOTE ".bare" — it is not optional and it is the single
       easiest thing to get wrong. Plain ".ai-label" is deliberately an
       accent-filled CHIP (§12/§19 give it the gradient and a star mask). The
       soft round mark you see at the head of every page in the candidate
       portal is the BARE form, which §33 applies inside the JS-assembled head
       band and §37 exposes as ".bare" for pages that build their own.
       Without ".bare" Tal renders as a hard orange pill, which is exactly how
       the first portal built on this design system came out. -->
  <section class="sec">
    <div class="ai-aura">
      <div class="ai-head"><span class="ai-label bare">Tal</span></div>
      <div class="ai-body"><p>Day 34 of 90, 5 of 13 chapters at 88%. Chapter 4
        is unfinished after four attempts, and your week 4 reflection is
        overdue.</p></div>
    </div>
    </section>
  </div>

  <!-- THE BLACK PLATE. In the starter on purpose: a page with no dark card and
       no accent fill reads as a generic admin table, however correct its
       hairlines are. "data-when" is an ATTRIBUTE, not a child. The CTA inside
       is a plain ".btn.btn-p" and comes out ORANGE, because §19 gives
       ".plate .btn-p" the brand gradient — outside a plate the same class is
       black. That pair is where most of the brand lives. -->
  <section class="sec">
    <div class="plate" data-when="in 2 days">
      <div class="plate-who">
        <!-- A REAL FACE. "AV.priya" is the photo the portal uses. ".av-ph"
             holds initials behind the image, so it degrades to "PN" if the
             asset is ever missing. -->
        <span class="av-ph" style="width:56px;height:56px"><i>PN</i>
          <img src="${AV.priya}" alt=""></span>
        <span class="plate-wb"><b>Priya Nair</b>
          <span>Cohort leader &middot; leads Cohort 41</span></span>
      </div>
      <div class="plate-t">Cohort Week 36 Session</div>
      <div class="plate-b">Thursday at 6:00 PM ET &middot; 9 others &middot; 60 minutes</div>
      <div class="plate-a">
        <button class="btn btn-p btn-sm noic" data-go="course">Join call ${I.video}</button>
        <button class="btn btn-sm noic plate-b2" data-go="course">Add to calendar</button>
      </div>
    </div>
  </section>

  <section class="sec">
    <div class="sec-h"><h2>Where you are</h2></div>
    <!-- FOUR CELLS. ".stats" is a FIXED grid — 2 columns on a phone, 4 from
         700px — and its hairlines ARE the 1px gap, with the rule colour
         showing through from the container's own background. Because the
         column count is fixed, an incomplete row cannot collapse: it paints
         grey. Four fills both tiers (4 across, or 2 + 2). Three is the one
         to avoid — the last cell spans the row
         (".stats > .stat:last-child:nth-child(odd)") and the two slots beside
         the first pair stay grey. -->
    <div class="stats">
      ${statCell('book',    'Chapters', '13<small>/13</small>', 'one a week')}
      ${statCell('chart',   'Average',  '92<small>%</small>',   'cohort average 79%')}
      ${statCell('calendar','Day',      '47<small>/90</small>', 'week 5 of 13')}
      ${statCell('video',   'Calls',    '12<small>/13</small>', '60 min, weekly')}
    </div>
  </section>

  <section class="sec">
    <div class="sec-h"><h2>This week</h2></div>
    <div class="tile-stack">
      ${row('book', 'Week 6', 'Coaching conversations', 'Four chapters, 45 minutes', 'course')}
      ${row('chart', '', 'Your assessment', 'Average 92% across thirteen', 'report')}
      ${row('calendar', '', 'Live call', 'Thursday, 6:30 PM', 'course')}
    </div>
  </section>

  <section class="sec">
    <div class="note"><span>${I.info}</span><div class="nb"><b>A note</b>A left
      rule and a tinted ground. Never a filled box with a radius.</div></div>
    <div class="mt5"><button class="btn btn-p" data-go="course">Open this week
      ${I.arrowRight}</button></div>
  </section>`;

V.course = () => `
  <div class="ph">
    <!-- NO BREADCRUMB. ".app .crumb{display:none}" (§12) — deliberately, and
         it is worth knowing why before you reach for one: no module is a child
         of another, they are siblings in the rail, and the rail already shows
         which one you are on. A trail with one hop above it is a row of chrome
         asserting a hierarchy the product does not have. The component is
         still in the system if a genuinely nested page ever needs it. -->
    <div class="ph-top">
      <button class="ph-back" data-go="home" aria-label="Back">${I.arrowLeft}</button>
    </div>
    <h1>Coaching conversations</h1>
    <p class="lead">A second page, to show that navigation is one attribute.</p>
  </div>

  <section class="sec">
    <div class="sec-h"><h2>The chapter</h2></div>
    <!-- AN EVEN COUNT. Same construction as ".stats": the hairlines are the
         1px gap over the rule colour. ".facts" columns are "auto-fit", so an
         even count collapses the spare tracks and fills the width — but an
         ODD count makes the last cell span the row
         (".facts > div:last-child:nth-child(odd)"), which stops the collapse
         and leaves the row above it painting grey. -->
    <div class="facts">
      <div><span class="l">Length</span><span class="v">45 minutes</span></div>
      <div><span class="l">Format</span><span class="v">Video, recorded</span></div>
      <div><span class="l">Due</span><span class="v">Thursday</span></div>
      <div><span class="l">Attempts</span><span class="v">1 of 2</span></div>
    </div>
  </section>

  <section class="sec">
    <div class="sec-h"><h2>Your progress</h2></div>
    <div class="prog">
      <div class="prog-top">
        <div><div class="prog-pct">72<small>%</small></div>
          <div class="prog-l">of the course done</div></div>
        <div class="prog-day"><div class="prog-dn">Day 47</div>
          <div class="prog-l">of 90</div></div>
      </div>
      <div class="prog-seg">${Array.from({length: 13}, (_, i) =>
        `<i class="${i < 9 ? 'done' : i === 9 ? 'now' : ''}"></i>`).join('')}</div>
    </div>
  </section>`;

V.report = () => `
  <div class="ph">
    <div class="ph-top">
      <button class="ph-back" data-go="home" aria-label="Back">${I.arrowLeft}</button>
    </div>
    <h1>Your assessment</h1>
  </div>

  <section class="sec">
    <div class="sec-h"><h2>By chapter</h2></div>
    <div class="tbl-wrap">
      <table class="tbl">
        <tr><th>Chapter</th><th class="num">Score</th><th class="num">Attempts</th><th>Finished</th></tr>
        <tr><td>Coaching conversations</td><td class="num">94%</td><td class="num">1</td><td>18 Aug</td></tr>
        <tr><td>Difficult feedback</td><td class="num">88%</td><td class="num">2</td><td>11 Aug</td></tr>
        <tr><td>Delegation</td><td class="num">92%</td><td class="num">1</td><td>4 Aug</td></tr>
      </table>
    </div>
  </section>

  <section class="sec">
    <div class="sec-h"><h2>Held about you</h2></div>
    <div>
      <div class="kv"><span class="k">Chapters finished</span><span class="v n">13 of 13</span></div>
      <div class="kv"><span class="k">Live calls attended</span><span class="v n">12 of 13</span></div>
      <div class="kv"><span class="k">Assessment average</span><span class="v n">92%</span></div>
    </div>
  </section>`;

/* ------------------------------------------------------------- the rail ---- */
/* Icon names come from the design system's set — `Object.keys(IP)` lists all
   75, and gallery.html draws them. */
const NAV = [
  {view: 'home',   icon: 'dashboard', label: 'Home'},
  {view: 'course', icon: 'book',      label: 'Coursework'},
  {view: 'report', icon: 'chart',     label: 'Assessment'},
];

/* ------------------------------------------------------------ a component -- */
/* One row, the design system's navigation row. `.clk` is what makes it a
   target; the trailing `.tile-arrow` is this product's GO. */
/* A FIGURE CELL. All three parts are required: ".stat" is a named grid and
   ".stat-ic" sits in "grid-area:ic", so a cell written without the icon does
   not just lose the mark, it loses the area and the figures stop lining up.
   The colour is not yours to pick — the design system cycles "--mk" over
   nth-child(4n+1..4), so the fourth cell is magenta because it is fourth. */
function statCell(icon, label, fig, note){
  return `<div class="stat">
      <span class="stat-ic">${I[icon] || ''}</span>
      <div class="stat-top"><div class="l">${label}</div><div class="n">${fig}</div></div>
      ${note ? `<div class="d">${note}</div>` : ''}
    </div>`;
}

function row(icon, eyebrow, title, sub, go){
  return `<button class="tile clk gcard" data-go="${go}">
    <span class="cardrow-ic">${I[icon]}</span>
    <span class="gcard-b">
      ${eyebrow ? `<span class="eyebrow">${eyebrow}</span>` : ''}
      <h3>${title}</h3><span class="sub">${sub}</span>
    </span>
    <svg class="tile-arrow" viewBox="0 -960 960 960">${inner('arrowRight')}</svg>
  </button>`;
}

/* -------------------------------------------------------------- the render - */
/* THE WHOLE FRAME IS REPRINTED EVERY TIME, which is the portal's model too.
   It means no component may keep state in the DOM — a class a click handler
   adds is gone on the next render — so anything interactive has to be a pure
   function of `S`. That constraint is what keeps a growing prototype honest.

   `data-rail` and `.on` are the persistent nav state; `data-enter` and
   `data-open` are ONE-RENDER motion cues, and nothing about layout may read
   them. */
function render(){
  const app = document.getElementById('app');

  app.innerHTML = `
    <header class="shell">
      <button class="shell-act nav-t" data-toggle="nav" aria-label="Menu">
        <span class="nav-t-mark">${TN_MARK}</span>
        <span class="nav-t-menu">${I.menu}</span>
      </button>
      <!-- THE REAL WORDMARK. "LOGO_K" is the black lockup the portal uses in
           its own app bar, embedded in talentnext-ds.js?b=8f52743f. "LOGO_W" is the white
           one for a dark ground. Do not set the brand as text. -->
      <a class="shell-logo" data-go="home"><img src="${LOGO_K}" alt="TalentNext"></a>
      <div class="shell-right">
        <span class="shell-name">Maryam Naz</span>
        <button class="shell-act" aria-label="Notifications">
          ${I.notification}<span class="shell-badge">2</span></button>
        <span class="av sm shell-avatar av-ph"><i>MN</i>
          <img src="${AV.hana}" alt=""></span>
      </div>
    </header>

    <div class="shell-body">
      <nav class="sidenav${S.nav ? ' on' : ''}">
        <div class="sn-main">
          ${NAV.map(n => `<a class="sn-item${n.view === S.view ? ' on' : ''}"
             data-go="${n.view}">${I[n.icon]}<span>${n.label}</span></a>`).join('')}
        </div>
      </nav>
      <div class="scrim${S.nav ? ' on' : ''}" data-toggle="nav"></div>
      <main class="main">
        <div class="page">${(V[S.view] || V.home)()}</div>
      </main>
    </div>`;

  app.setAttribute('data-view', S.view);
  app.setAttribute('data-rail', S.nav ? 'open' : 'shut');
  dsStagger(app.querySelector('.page'));
  dsEnter(app);

  /* TAL'S SUMMARY WRITES ITSELF. Three helpers is the whole of the frame's
     behaviour and this is the third — see `dsTypeSummary`'s note in
     talentnext-ds.js for why the paragraph gets drawn twice (short version:
     a typewriter that grows its own box shoves the page down mid-read, so a
     hidden copy holds the final height open and the visible copy fills in
     over it).

     LAST, and after `dsEnter`, because it writes into the paragraph and
     anything that rebuilds the page afterwards would throw its work away.

     `S.view` IS THE KEY — "which page am I on". The helper appends the
     paragraph's own words to it, so the line re-types when the page changes
     OR when the reading does, and prints instantly on any other re-render.
     On a page with a detail view, pass the subject too:
     `dsTypeSummary(p, S.view + '/' + S.member)`. */
  dsTypeSummary(app.querySelector('.modhead .ai-body p'), S.view);
}

/* ------------------------------------------------------------- navigation -- */
/* One delegated listener on a container that outlives the render, because
   `app.innerHTML = …` throws away every element a handler was bound to.
   `data-go` is a plain view name and `data-toggle` is a flag — no colons to
   split, no branching in the router. */
document.getElementById('host').addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-toggle]');
  if(!t) return;
  if(t.dataset.toggle === 'nav'){ S.nav = !S.nav; return render(); }
  if(t.dataset.go){
    S.view = t.dataset.go;
    S.nav = false;                 /* picking a module shuts the rail */
    render();
    document.querySelector('.main').scrollTop = 0;
  }
});

render();

/* ==========================================================================
   THE ONE THING TO KNOW BEFORE YOU ADD A PAGE

   At 900px and up, a `.sec` that has a `.sec-h` splits into a 184px label
   column and a content column. That is the system's desktop reading pattern
   and you get it for free — but it is keyed on WHAT THE SECTION CONTAINS.
   A section holding `.stats`, `.facts`, `.tbl-wrap`, `.cardrow`, `.gcard` or
   `.tile-stack` opts out automatically, because those components are sized
   against the full column width.

   Invent a wrapper of your own — `<div class="my-list">` — and the heading
   keeps its 184px column while your content is laid out against a width that
   is 184px narrower than it expects. The two collide.

   So: build sections out of those six, and the spine is free. If you genuinely
   need a new wrapper, restate the opt-out INSIDE the same container query,
   because a container query is its own cascade tier and cannot be beaten from
   outside one:

       @container app (min-width:900px){
         .sec:has(> .my-list){display:block;
           padding-left:var(--pad-x);padding-right:var(--pad-x)}
         .sec:has(> .my-list) > .sec-h{
           border-right:0;min-height:0;margin-bottom:var(--s05);padding:0}
       }

   And keep `.sec-h` headings to three words. 184px is two lines.
   ========================================================================== */
</script>
</body>
</html>
